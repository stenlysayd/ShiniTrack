name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Set NDK_HOME
        run: |
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            echo "NDK_HOME=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> $GITHUB_ENV
          fi

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV

      - name: Build Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cargo tauri android build --apk -t aarch64

      - name: Rename APK
        run: |
          # Find the generated APK and rename it
          APK_PATH=$(find app/src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" "ShiniTrack-${{ github.ref_name }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ShiniTrack-${{ github.ref_name }}.apk
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
            
            This is an automated release.
          draft: false
          prerelease: false
