<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090a0f" />
  <title>ShiniTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="topbar">
    <button id="back" class="icon-btn hidden" aria-label="Kembali">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <div class="brand-title">
      <img src="logo.png" class="brand-logo" alt="ShiniTrack Logo" />
      <div class="brand-meta">
        <h1 id="title">ShiniTrack</h1>
        <span id="subtitle" class="brand-sub">Manga Tracker</span>
      </div>
    </div>
    <div id="incognito-badge" class="incognito-pill hidden" title="Mode Penyamaran Aktif">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h20M7 12a5 5 0 0 1 10 0M5 15a3 3 0 1 0 6 0 3 3 0 0 0-6 0zm8 0a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"/>
      </svg>
      <span>Penyamaran</span>
    </div>
    <button id="sync" class="icon-btn" aria-label="Sinkronisasi Sekarang" title="Sinkronisasi Sekarang">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
    </button>
  </header>

  <!-- Sticky In-App Update Banner -->
  <div id="update-banner" class="update-banner hidden">
    <div class="ub-pill">NEW</div>
    <div class="ub-text">
      <b id="ub-version">v0.2.1 Tersedia</b>
      <span id="ub-desc">Pembaruan baru siap dipasang</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="ub-btn" class="btn small primary">Perbarui</button>
      <button id="ub-dismiss" class="icon-btn" style="width:32px; height:32px; background:rgba(255,255,255,0.1);" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main View Container -->
  <main id="view" aria-live="polite"></main>

  <!-- Bottom Navigation Tab Bar (Mihon Standard) -->
  <nav class="tabbar" aria-label="Navigasi Utama">
    <a href="#/library" data-tab="library">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </span>
      <span class="tab-label">Pustaka</span>
    </a>
    <a href="#/updates" data-tab="updates">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <b id="badge" class="badge hidden">0</b>
      </span>
      <span class="tab-label">Pembaruan</span>
    </a>
    <a href="#/history" data-tab="history">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </span>
      <span class="tab-label">Riwayat</span>
    </a>
    <a href="#/explore" data-tab="explore">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
      </span>
      <span class="tab-label">Jelajahi</span>
    </a>
    <a href="#/more" data-tab="more">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
          <circle cx="19" cy="12" r="1" fill="currentColor"></circle>
          <circle cx="5" cy="12" r="1" fill="currentColor"></circle>
        </svg>
      </span>
      <span class="tab-label">Lainnya</span>
    </a>
  </nav>

  <!-- In-App Update Modal -->
  <div id="update-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-badge-row">
          <span class="modal-badge">RILIS TERBARU</span>
          <span id="modal-update-date" class="modal-date">Rilis: Baru</span>
        </div>
        <h2 id="modal-update-title">ShiniTrack Update</h2>
      </div>
      <div class="modal-body">
        <div class="modal-section-label">Catatan Perubahan</div>
        <div id="modal-changelog" class="changelog-box"></div>
        <div id="modal-dl-progress" class="dl-progress-box hidden">
          <div class="dl-status">
            <span id="dl-text">Menghubungkan ke GitHub...</span>
            <span id="dl-pct">0%</span>
          </div>
          <div class="progress-bar"><div id="dl-bar" class="progress-fill"></div></div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn">Nanti</button>
        <button id="modal-install-btn" class="btn primary">Unduh & Pasang</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="icons.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
