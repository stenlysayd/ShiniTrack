<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#181A22"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    
    <!-- Primary Scythe Crimson Gradient -->
    <linearGradient id="scytheRed" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#E51937"/>
      <stop offset="100%" stop-color="#B30E26"/>
    </linearGradient>

    <!-- Crisp Page/Blade Silver Glow -->
    <linearGradient id="silverBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame (Standard Android App Icon Shape) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#cardBg)" stroke="#232634" stroke-width="4"/>

  <!-- Subtle Manga Page Outline Geometry (Left) -->
  <path d="M 124 168 C 124 152 136 140 152 140 L 230 140 C 236 140 242 144 246 150 L 274 192 L 204 192 C 180 192 160 212 160 236 L 160 340 C 140 338 124 321 124 300 Z" 
        fill="#FFFFFF" 
        opacity="0.12"/>

  <!-- The "S" Monogram: Dynamic Scythe Crescent + Origami Manga Bookmark -->
  <!-- Top Crescent Blade Wing -->
  <path d="M 172 136 C 248 116 356 128 376 210 C 382 234 374 252 358 258 C 342 264 328 252 322 234 C 310 196 242 182 196 196 L 244 260 L 188 260 C 170 260 154 242 158 214 C 160 200 164 170 172 136 Z" 
        fill="url(#silverBlade)"/>

  <!-- Main Dynamic Crimson Scythe Body (Forms the Flowing S-Curve) -->
  <path d="M 372 208 C 378 244 362 284 316 314 L 202 390 C 160 418 126 392 140 354 C 150 328 178 304 220 278 L 312 222 C 334 208 356 196 372 208 Z" 
        fill="url(#scytheRed)"/>

  <!-- Sharp Cutting Edge of the Scythe (Negative Space Inset) -->
  <path d="M 194 394 C 272 384 350 330 366 264 C 368 256 362 250 354 254 C 314 276 250 318 184 376 C 180 380 184 390 194 394 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>

  <!-- Live Pulse / Notification Indicator (Top-Right Ping Dot) -->
  <circle cx="384" cy="128" r="14" fill="#FF385C"/>
  <circle cx="384" cy="128" r="26" fill="none" stroke="#FF385C" stroke-width="4" opacity="0.4"/>
</svg>
